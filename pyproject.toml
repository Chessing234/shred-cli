[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shred-cli"
version = "0.2.1"
description = "Type fast, shred harder — MIDI guitar arpeggios from your typing speed"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Shred-CLI Contributors"}
]
keywords = ["midi", "keyboard", "typing", "guitar", "arpeggio", "cli", "music", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Games/Entertainment",
    "Topic :: Education",
    "Topic :: Office/Business",
]
dependencies = [
    "pynput>=1.7",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "click>=8.0",
]

[project.optional-dependencies]
dashboard = ["rich>=13.0"]
synth = ["sounddevice>=0.4", "numpy>=1.24"]
all = ["rich>=13.0", "sounddevice>=0.4", "numpy>=1.24"]
dev = ["pytest>=7.0", "black>=23.0", "flake8>=6.0", "mypy>=1.0"]

[project.scripts]
shred = "shredcli.cli:cli"

[project.urls]
Homepage = "https://github.com/example/shred-cli"
Repository = "https://github.com/example/shred-cli"
Issues = "https://github.com/example/shred-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["shredcli*"]

[tool.setuptools.package-data]
shredcli = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
