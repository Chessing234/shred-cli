[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shred-cli"
version = "0.2.1"
description = "Type fast, shred harder — guitar arpeggios that follow your typing speed"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Taksh Kothari", email = "takshkothari@users.noreply.github.com"}
]
maintainers = [
    {name = "Taksh Kothari"}
]
keywords = [
    "midi",
    "keyboard",
    "typing",
    "guitar",
    "arpeggio",
    "cli",
    "music",
    "productivity",
    "daemon",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pynput>=1.7",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "click>=8.0",
]

[project.optional-dependencies]
dashboard = ["rich>=13.0"]
synth = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
]
all = [
    "rich>=13.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
shred = "shredcli.cli:main"

[project.urls]
Homepage = "https://github.com/Chessing234/shred-cli"
Documentation = "https://github.com/Chessing234/shred-cli#readme"
Repository = "https://github.com/Chessing234/shred-cli"
Issues = "https://github.com/Chessing234/shred-cli/issues"
Changelog = "https://github.com/Chessing234/shred-cli/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["shredcli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
